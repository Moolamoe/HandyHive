<!DOCTYPE html>

<html lang="en-ZA">
<head>
<script>
// Admin bootstrap: installs /api/media shim early when ?__admin=1 is present so admin
// preview in the iframe has persistence (same-origin IndexedDB) and the shim runs
// before other page scripts.
(function(){
  try {
    if (new URLSearchParams(location.search).get('__admin') !== '1') return;
    // Mark admin mode early on both <html> and <body> (body may not exist yet)
    try { document.documentElement.setAttribute('data-admin', 'true'); } catch(e){}
    if (document.body) {
      document.body.dataset.admin = 'true';
    } else {
      document.addEventListener('DOMContentLoaded', function(){ try{ document.body.dataset.admin = 'true'; }catch(e){} });
    }

    // Minimal network-first IndexedDB shim for /api/media
    (function(){
      // Use a fixed DB name so admin pages and the preview iframe share the same store
      const DB_NAME = 'handyhive:root';
      function openDB(){
        return new Promise((resolve,reject)=>{
          const r = indexedDB.open(DB_NAME, 1);
          r.onupgradeneeded = function(){ try { r.result.createObjectStore('settings'); } catch(e){} };
          r.onsuccess = function(){ resolve(r.result); };
          r.onerror = function(){ reject(r.error); };
        });
      }
      async function readMedia(){ const db = await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction('settings','readonly'); const req=tx.objectStore('settings').get('media'); req.onsuccess=function(){ try{ res(req.result||[]); }catch(e){ res([]); } }; req.onerror=function(){ rej(req.error); }; }); }
      async function writeMedia(list){ const db = await openDB(); return new Promise((res,rej)=>{ const tx=db.transaction('settings','readwrite'); tx.objectStore('settings').put(list,'media'); tx.oncomplete=function(){ res(); }; tx.onerror=function(){ rej(tx.error); }; }); }
      function fileToDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=function(){ res(r.result); }; r.onerror=function(){ rej(r.error); }; r.readAsDataURL(file); }); }

      async function handleMediaRequest(method, body){
        method = (method||'GET').toUpperCase();
        if (method === 'GET') {
          try {
            const net = await (window.__origFetch ? window.__origFetch('/api/media',{cache:'no-store'}) : fetch('/api/media',{cache:'no-store'}));
            if (net && net.ok) {
              const j = await net.json(); try{ await writeMedia(j);}catch(e){}
              return {status:200,json:j};
            }
          } catch(e){ }
          const local = await readMedia();
          return {status:200,json:local};
        }
        if (method === 'POST') {
          if (!(body instanceof FormData)) throw new Error('POST /api/media expects FormData');
          const file = body.get('file');
          const slot = body.get('slot') || 'hero';
          if (!(file instanceof File)) throw new Error('Choose an image first');
          if (!['image/jpeg','image/png','image/webp'].includes(file.type)) throw new Error('Please choose JPG, PNG or WebP images.');
          if (file.size > 5*1024*1024) throw new Error('Image must be under 5MB');
          const data = await fileToDataURL(file);
          const item = { slot, id: String(Date.now()), data, type: file.type, name: file.name, updated_at: new Date().toISOString() };
          const list = await readMedia(); const idx = list.findIndex(m=>m.slot===slot); if (idx>=0) list[idx]=item; else list.push(item);
          await writeMedia(list);
          return {status:201,json:item};
        }
        return {status:405,json:{error:'Method not allowed'}};
      }

      if (!window.api){
        window.api = async function(url, options={}){
          const method = (options && options.method) ? options.method.toUpperCase() : 'GET';
          if (url === '/api/media') return (await handleMediaRequest(method, options && options.body)).json;
          const r = await (window.__origFetch ? window.__origFetch(url, options) : fetch(url, options));
          if (!r.ok) throw new Error('Network error '+r.status);
          try{ return await r.json(); } catch(e){ return null; }
        };
      }

      if (!window.__origFetch){
        window.__origFetch = window.fetch.bind(window);
        window.fetch = async function(input, init){
          try {
            const url = (typeof input === 'string') ? input : (input && input.url) || '';
            const pathname = new URL(url, location.href).pathname;
            if (pathname === '/api/media') {
              const method = (init && init.method) || (typeof input !== 'string' && input && input.method) || 'GET';
              const body = (init && init.body) || (typeof input !== 'string' && input && input.body) || null;
              const res = await handleMediaRequest(method, body);
              return new Response(JSON.stringify(res.json), { status: res.status, headers: {'Content-Type':'application/json'} });
            }
          } catch(e) { console.warn('fetch shim error', e); }
          return window.__origFetch(input, init);
        };
      }

      console.info('Admin shim installed (network-first, IndexedDB fallback)');
    })();
  } catch(e){ console.warn('admin bootstrap failed', e); }
})();
</script>

<!-- Remove only exact admin links so we don't accidentally remove unrelated elements -->
<script>
document.addEventListener('DOMContentLoaded', function(){
  try {
    Array.from(document.querySelectorAll('a[href]')).forEach(function(a){
      try{
        const href = a.getAttribute('href') || '';
        if (!href.trim()) return;
        // Resolve relative URLs safely
        let resolved;
        try { resolved = new URL(href, location.href); } catch(e){ return; }
        const path = resolved.pathname.replace(/\/+$|\/+$/, ''); // trim trailing slashes
        if (path === '/admin' || path === '/admin/index.html' || path.endsWith('/admin') || path.endsWith('/admin/index.html')){
          a.remove();
        }
      }catch(e){}
    });
  } catch(e){ console.warn('Remove admin link script failed', e); }
});
</script>
